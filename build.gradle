plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.44'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Curios provides the slot inventory, slot rendering, and attribute application.
    // It is a mandatory runtime dependency; it is not bundled into this mod jar.
    // A local compile-time copy keeps the build reproducible on offline pack machines.
    compileOnly files("libs/curios-forge-${curios_version}.jar")
    runtimeOnly files("libs/curios-forge-${curios_version}.jar")

    // GeckoLib is used by the animated Nightmare Eye model.
    compileOnly files("libs/geckolib-forge-${geckolib_version}.jar")
    runtimeOnly files("libs/geckolib-forge-${geckolib_version}.jar")

    // JEI integration is optional at runtime.
    compileOnly files("libs/jei-1.20.1-forge-${jei_version}.jar")
    runtimeOnly files("libs/jei-1.20.1-forge-${jei_version}.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// The development machine has no reliable access to Mojang's asset CDN.
// A dedicated server does not need the client asset index.
tasks.matching { it.name == 'downloadAssets' || it.name == 'extractNatives' }.configureEach {
    enabled = false
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_description', mod_description
    inputs.property 'curios_version', curios_version

    filesMatching('META-INF/mods.toml') {
        expand mod_id: mod_id,
               mod_name: mod_name,
               mod_version: mod_version,
               mod_authors: mod_authors,
               mod_license: mod_license,
               mod_description: mod_description,
               curios_version: curios_version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}
